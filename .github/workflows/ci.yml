name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # The web app is type-checked by `next build` below; check the packages here.
      - name: Typecheck packages
        run: pnpm -r --filter "!web" --if-present typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # UI smoke tests (Playwright + axe) against the production build and a throwaway SQLite DB.
      # Pull requests only: main only receives squash-merges of PRs that already passed them.
      - name: Playwright version
        id: pw
        if: github.event_name == 'pull_request'
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: github.event_name == 'pull_request'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # The runner image already has Chrome's system libraries, so only the browser is fetched
      # (and only on a cache miss).
      - name: Install Chromium
        if: github.event_name == 'pull_request'
        run: pnpm --filter web exec playwright install chromium

      - name: E2E smoke tests
        if: github.event_name == 'pull_request'
        run: pnpm --filter web e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
